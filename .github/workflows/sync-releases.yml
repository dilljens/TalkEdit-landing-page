name: Sync Releases to R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
  repository_dispatch:
    types: [release-published]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p /tmp/assets
          gh release download "$TAG" \
            --repo dilljens/TalkEdit \
            --dir /tmp/assets

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9b6c3059be77c9f44b5ec7365fa50b8
        run: |
          # List buckets to find the right one
          BUCKET=$(npx wrangler r2 bucket list 2>/dev/null | grep -oE '\S+' | tail -1)
          if [ -z "$BUCKET" ]; then
            echo "Could not detect bucket name"
            exit 1
          fi
          echo "Using bucket: $BUCKET"
          for f in /tmp/assets/*; do
            name=$(basename "$f")
            echo "Uploading $name..."
            npx wrangler r2 object put "$BUCKET/$name" --file "$f"
          done
