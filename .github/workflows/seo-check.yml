name: SEO Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6 AM

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Broken link check
        run: npx linkinator https://talk-edit.com --recurse --skip "mailto:|cdn.tailwindcss.com|fonts.googleapis.com|fonts.gstatic.com"

      - name: Sitemap check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://talk-edit.com/sitemap.xml)
          if [ "$STATUS" != "200" ]; then echo "Sitemap returned $STATUS"; exit 1; fi
          echo "Sitemap OK ($STATUS)"

      - name: Page speed (mobile)
        if: ${{ secrets.PAGESPEED_API_KEY != '' }}
        run: |
          for page in "/" "/vs/descript" "/blog/text-based-video-editing-guide" "/blog/best-offline-ai-video-editors" "/blog/remove-filler-words-podcast"; do
            URL="https://talk-edit.com$page"
            echo "--- $URL ---"
            curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$URL&key=${{ secrets.PAGESPEED_API_KEY }}&strategy=mobile" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); c=d['lighthouseResult']['categories']; print(f\"Perf: {c['performance']['score']*100:.0f}  A11y: {c['accessibility']['score']*100:.0f}  SEO: {c['seo']['score']*100:.0f}\")"
          done
