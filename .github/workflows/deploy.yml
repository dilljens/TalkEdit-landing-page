name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.2.10)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove large binaries before Pages deploy
        run: rm -rf downloads/
      - name: Fetch latest version tag
        id: version
        run: |
          TAG="v0.2.21"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Inject version into index.html
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Using version: $TAG"
          sed -i "s/Beta v[0-9.]\+/Beta $TAG/" index.html
      - name: Install dependencies
        run: npm install
      - name: Build CSS
        run: npx tailwindcss -i src/style.css -o assets/style.css
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy to Pages
        run: npx wrangler pages deploy . --project-name talk-edit-landing-page --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9b6c3059be77c9f44b5ec7365fa50b8
